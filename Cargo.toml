[package]
name = "sokol-rust-imgui-template"
version = "0.1.0"
edition = "2024"

[features]
# Renders a second UI with egui (see src/egui_sokol.rs) next to the imgui one.
egui = ["dep:egui"]

[dependencies]
imgui = { git = "https://github.com/imgui-rs/imgui-rs", rev = "e06b05c0f97062af4ea7856ecc5a7216feb3ace2" }
sokol = { git = "https://github.com/floooh/sokol-rust", rev = "b2b884b439a0ecdc3437e096467afaccac03a4b9" }
# Parse fonts ourselves until imgui-rs gets updated and loses the glyph_ranges requirement
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# We supply our own fonts (DroidSans), so the bundled default fonts are not needed.
egui = { version = "0.36", optional = true, default-features = false }

[profile.dev]
# Never build without optimizations
opt-level = 1
# We do not debug anyway
debug = "line-tables-only"

[profile.release]
# Enable backtrace info
debug = "line-tables-only"
# debug = "none"
